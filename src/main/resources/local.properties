# Local development configuration.
# Real deployments (CloudHub/RTF) should override these via Anypoint's
# Secure Configuration Properties or environment-specific property files —
# this file exists only so the app has sane local defaults and never fails
# to start with a missing-property error.

vizarce.api.key=REPLACE_WITH_YOUR_VIZARCE_API_KEY
vizarce.api.baseUrl=https://www.vizarce.com/api

salesforce.username=REPLACE_WITH_YOUR_SALESFORCE_USERNAME
salesforce.password=REPLACE_WITH_YOUR_SALESFORCE_PASSWORD
salesforce.securityToken=REPLACE_WITH_YOUR_SALESFORCE_SECURITY_TOKEN
